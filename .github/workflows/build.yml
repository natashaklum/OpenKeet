name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core-test:
    name: core + dht tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @openkeet/core
      - run: npm test --workspace @openkeet/core
      - run: npm test --workspace @openkeet/dht
      - run: node scripts/bundle-vendor.mjs --out /tmp/vendor-test

  build-linux:
    name: linux desktop (AppImage + deb)
    runs-on: ubuntu-latest
    needs: core-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: system deps for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libatomic1 libgtk-4-1 libwebkitgtk-6.0-4 libgbm1 libasound2t64 || \
          sudo apt-get install -y libfuse2 libatomic1 libgtk-4-1 libwebkit2gtk-4.1-0 libgbm1 libasound2
      - run: npm ci
      - run: npm run build --workspace @openkeet/core
      - run: npm run build --workspace @openkeet/desktop
      - name: verify electron install (no launch — CI has no sandbox)
        working-directory: apps/desktop
        run: |
          node -p "require('electron/package.json').version"
          test -f ../../node_modules/electron/dist/electron && echo electron-binary-present
      - name: ensure app-builder binary (electron-builder native helper)
        run: |
          uname -m
          npm --version
          ls -la node_modules/app-builder-bin/linux/x64/ || true
          ABB=node_modules/app-builder-bin/linux/x64/app-builder
          if [ ! -x "$ABB" ]; then
            echo "app-builder missing/not executable after npm ci — forcing reinstall"
            npm install --no-save app-builder-bin@5.0.0-alpha.10
            chmod +x "$ABB" || true
            ls -la node_modules/app-builder-bin/linux/x64/
          fi
          test -x "$ABB" && echo app-builder-present
      - run: npm run dist --workspace @openkeet/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: openkeet-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  build-android:
    name: android APK (debug)
    runs-on: ubuntu-latest
    needs: core-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: setup Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - run: npm ci
      - run: npm run build --workspace @openkeet/core
      - run: npm run build --workspace @openkeet/android
      - name: capacitor android platform
        working-directory: apps/android
        run: |
          npx cap add android || true
          npx cap sync android
      - name: build debug APK
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: openkeet-android-apk
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
