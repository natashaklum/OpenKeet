name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core-test:
    name: core + dht tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run build --workspace @openkeet/core
      - run: npm test --workspace @openkeet/core
      - run: npm test --workspace @openkeet/dht
      - run: node scripts/bundle-vendor.mjs --out /tmp/vendor-test

  build-linux:
    name: linux desktop (AppImage + deb)
    runs-on: ubuntu-latest
    needs: core-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: system deps for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libatomic1 libgtk-4-1 libwebkitgtk-6.0-4 libgbm1 libasound2t64 || \
          sudo apt-get install -y libfuse2 libatomic1 libgtk-4-1 libwebkit2gtk-4.1-0 libgbm1 libasound2
      - run: npm ci || npm install
      - run: npm run build --workspace @openkeet/core
      - run: npm run build --workspace @openkeet/desktop
      - run: npm run dist --workspace @openkeet/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: openkeet-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  build-android:
    name: android APK (debug)
    runs-on: ubuntu-latest
    needs: core-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci || npm install
      - run: npm run build --workspace @openkeet/core
      - run: npm run build --workspace @openkeet/android
      - name: capacitor android platform
        working-directory: apps/android
        run: |
          npx cap add android || true
          npx cap sync android
      - name: build debug APK
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: openkeet-android-apk
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
